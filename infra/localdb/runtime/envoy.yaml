static_resources:
  listeners:
    - name: local_api
      address:
        socket_address: {address: 0.0.0.0, port_value: 8000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: local
                      domains: ['*']
                      routes:
                        - match: {prefix: /rest/v1/}
                          route: {cluster: rest, prefix_rewrite: /, timeout: 30s}
                        - match: {prefix: /storage/v1/}
                          route: {cluster: storage, prefix_rewrite: /, timeout: 30s}
                        - match: {prefix: /}
                          direct_response: {status: 404}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: rest
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: rest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: rest, port_value: 3000}
    - name: storage
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: storage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: storage, port_value: 5000}
