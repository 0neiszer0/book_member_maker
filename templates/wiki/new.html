{% extends 'wiki/base.html' %}
{% block head %}{{ super() }}<link rel="stylesheet" href="{{ url_for('static', filename='wiki_editor.css') }}">{% endblock %}
{% block wiki_content %}<header class="wiki-heading"><h1>새 문서</h1></header><p>먼저 같은 내용의 문서가 있는지 검색해 주세요.</p><form action="{{ url_for('wiki.new') }}" method="get" class="wiki-new"><label for="wiki-title">문서 제목</label><input id="wiki-title" name="title" maxlength="200" required>
<fieldset class="wiki-template-picker"><legend>시작 틀 고르기</legend><div class="wiki-starter-cards">{% for t in starter_templates %}<label class="wiki-template-card"><input type="radio" name="template" value="{{ t.key }}"{% if loop.first %} checked{% endif %}><strong>{{ t.title }}</strong><span>{{ t.desc }}</span></label>{% endfor %}</div></fieldset>
<button class="lms-button lms-button-primary" type="submit">작성 시작</button></form>{% endblock %}
