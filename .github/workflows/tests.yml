name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      FLASK_SECRET_KEY: ci-test-only
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_SERVICE_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:css
      - run: git diff --exit-code -- static/tailwind.css
      - run: node testing/test_group_editor_state.js
      - run: node testing/test_group_drag.js
      - run: node testing/test_seminar_schedule.js
      - run: node testing/test_attendance_roster_race.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s testing -p "test_*.py" -v
